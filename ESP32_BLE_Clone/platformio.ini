[platformio]
default_envs = luatos_classic, luatos_usb

[env]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L

[env:luatos_classic]
build_flags = -D CORE_DEBUG_LEVEL=0 -D ARDUINO_USB_CDC_ON_BOOT=0

[env:luatos_usb]
build_flags = -D CORE_DEBUG_LEVEL=0 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

